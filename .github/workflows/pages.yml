name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build:pages

      - name: Disable Jekyll processing
        run: touch dist/pages/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub Pages can also be served from a branch (Settings → Pages → Source:
  # "Deploy from a branch"). In that mode the uploaded artifact is never served
  # and the README is rendered instead, so publish the same build at the
  # repository root, which is what a branch source serves. This is idempotent:
  # it only commits when the compiled output actually changed.
  publish-branch-source:
    name: Publish build for branch-based Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact

      - name: Extract site
        run: mkdir -p _site && tar -xzf _artifact/artifact.tar -C _site

      - name: Copy build to served root
        run: |
          rm -rf assets
          cp -R _site/assets ./assets
          cp _site/index.html ./index.html
          if [ -f _site/favicon.svg ]; then cp _site/favicon.svg ./favicon.svg; fi
          touch .nojekyll

      - name: Commit and push when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg .nojekyll
          if git diff --cached --quiet; then
            echo "Compiled output is already up to date."
            exit 0
          fi
          git commit -m "chore: publish compiled site for branch-based Pages [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Request a Pages build
        continue-on-error: true
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
